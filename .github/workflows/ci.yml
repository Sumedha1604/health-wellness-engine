name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: wellness_user
      DB_PASSWORD: wellness_password
      DB_NAME: health_wellness_test
      JWT_SECRET: ci-test-jwt-secret
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: health_wellness_test
      MYSQL_USER: wellness_user
      MYSQL_PASSWORD: wellness_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: health_wellness_test
          MYSQL_USER: wellness_user
          MYSQL_PASSWORD: wellness_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uwellness_user -pwellness_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Python for test data
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install food import dependencies
        run: python -m pip install pandas sqlalchemy pymysql python-dotenv

      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASSWORD" --silent; then
              exit 0
            fi

            echo "Waiting for mysql service (${attempt}/30)..."
            sleep 2
          done

          echo "The mysql service did not become ready."
          exit 1

      - name: Initialize test database
        run: mysql -h "$DB_HOST" -P "$DB_PORT" -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" < database/schema.sql

      - name: Import food catalog used by API tests
        run: python -m data_pipeline.importers.import_foods

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ml-service:
    name: ML service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ML dependencies
        working-directory: ml-service
        run: python -m pip install -r requirements.txt

      - name: Run ML tests
        working-directory: ml-service
        run: python -m unittest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build --tag health-wellness-frontend ./frontend

      - name: Build backend image
        run: docker build --tag health-wellness-backend ./backend

      - name: Build ML service image
        run: docker build --tag health-wellness-ml-service ./ml-service
